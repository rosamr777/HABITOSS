<title>Mis hábitos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Concepto: una columna centrada. Arriba la tarjeta "Hoy" para marcar en un toque; debajo resumen y progreso diario; al final la cuadrícula del mes con la columna de nombres fija.
   Solo tinta sobre blanco roto y líneas de 1px, sin color de acento. */
:root {
  --bg: #FDFCFA;
  --ink: #161614;
  --muted: #6E6C64;
  --line: #161614;
  --hair: #D9D7CE;
  --tint: #F7F5F0;
  --tint2: #EEEBE3;
  --bar: #CCC9BE;
  --ok-bg: #161614;
  --ok-fg: #F6F5F0;
  --pink: #F4A8C4;
  --fuchsia: #E0338F;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1B19;
    --ink: #EEECE4;
    --muted: #9C9A90;
    --line: #CFCDC4;
    --hair: #353430;
    --tint: #232321;
    --tint2: #2C2B28;
    --bar: #4A4944;
    --ok-bg: #EEECE4;
    --ok-fg: #1B1B19;
    --pink: #D77AA0;
    --fuchsia: #EC4FA3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1B19;
  --ink: #EEECE4;
  --muted: #9C9A90;
  --line: #CFCDC4;
  --hair: #353430;
  --tint: #232321;
  --tint2: #2C2B28;
  --bar: #4A4944;
  --ok-bg: #EEECE4;
  --ok-fg: #1B1B19;
  --pink: #D77AA0;
  --fuchsia: #EC4FA3;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--sans);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 110px; display: flex; flex-direction: column; gap: 16px; }

/* Cabecera */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 8px; }
h1 { font: 400 clamp(34px, 6vw, 46px)/1.05 var(--serif); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.sub::first-letter { text-transform: uppercase; }
.navrow { display: flex; align-items: center; gap: 8px; }
.monthnav { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.navbtn { width: 38px; height: 36px; border: 0; background: transparent; display: grid; place-items: center; transition: background .12s; }
.navbtn:hover:not(:disabled) { background: var(--tint2); }
.navbtn:disabled { opacity: .3; cursor: default; }
.monthnav .lbl { min-width: 138px; height: 36px; display: grid; place-items: center; font-weight: 500; font-size: 14px; border-inline: 1px solid var(--line); padding: 0 6px; }
.btn { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-weight: 500; font-size: 14px; transition: background .12s; }
.btn:hover { background: var(--tint2); }
.btn.solid { background: var(--ink); color: var(--bg); }
.btn.solid:hover { opacity: .88; background: var(--ink); }

/* Tarjetas */
.card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.card-h h2 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; }
.meta { font: 400 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Casillas */
.chk { width: 16px; height: 16px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: transparent; display: inline-grid; place-items: center; transition: background .12s; }
.chk:hover:not(:disabled) { background: var(--tint2); }
.chk[aria-pressed="true"], .chk[aria-pressed="true"]:hover { background: var(--pink); }
.chk:disabled { border-style: dashed; border-color: var(--hair); cursor: default; }
.chk.big { width: 30px; height: 30px; border-radius: 7px; }

/* Hoy */
.hrow { display: flex; align-items: center; gap: 4px; padding: 0 12px 0 0; border-bottom: 1px solid var(--hair); transition: background .15s; }
.hrow .rowbtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 16px 8px 16px 16px; border: 0; background: transparent; text-align: left; }
.hrow .rowbtn:focus-visible { outline-offset: -3px; }
.hrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
.hrow:not(.edit):not(.is-done):hover { background: var(--tint); }
.hrow.is-done { background: var(--pink); }
.hrow.is-done .streak span { color: var(--ink); }
.hrow.is-done .icon { color: var(--ink); }
.streak { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; min-width: 44px; }
.streak b { font: 500 18px var(--mono); font-variant-numeric: tabular-nums; }
.streak span { font-size: 11px; color: var(--muted); }
.streak.at-risk b { color: var(--muted); }
.icon { width: 32px; height: 32px; border: 1px solid transparent; background: transparent; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.icon:hover { border-color: var(--line); color: var(--ink); }
.hrow.edit { flex-wrap: wrap; gap: 12px; padding: 12px 16px; background: var(--tint); }
.hrow.edit input { flex: 1 1 180px; min-width: 0; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: inherit; padding: 0 12px; font: inherit; }
.hrow.edit .note { flex: 1 1 100%; margin: 0; color: var(--muted); font-size: 13px; }
.hrow.edit > * { flex: 1 1 100%; min-width: 0; }
.hrow .name small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.3; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.hrow .name small.hit { color: var(--ink); font-weight: 600; }
.hrow.is-done .name small { color: var(--ink); }
.opt { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.optl { min-width: 118px; font: 600 10.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.segb { min-width: 36px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-size: 14px; }
.segb:hover:not(:disabled) { background: var(--tint2); }
.segb[aria-pressed="true"], .segb[aria-pressed="true"]:hover { background: var(--pink); }
.segb:disabled { opacity: .4; cursor: default; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper b { min-width: 1.5ch; text-align: center; font: 500 16px var(--mono); }
.gnote { font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.add { display: flex; gap: 8px; padding: 12px 16px; }
.add input { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; padding: 0 12px; font: inherit; }
.add input::placeholder { color: var(--muted); }
.add .btn { height: 40px; padding: 0 18px; }

.empty { padding: 22px 16px 6px; }
.empty-t { margin: 0; font: 400 24px/1.2 var(--serif); }
.empty-s { margin: 6px 0 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; }
.chip { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-size: 14px; }
.chip:hover { background: var(--tint2); }
.chip[aria-pressed="true"], .chip[aria-pressed="true"]:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Resumen y progreso */
.sec { scroll-margin-top: 12px; }
.sec.stack { display: flex; flex-direction: column; gap: 16px; }
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px; align-items: start; }
.summary { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .summary { grid-template-columns: minmax(0, 1fr); } }
.card-h.hasnav { align-items: center; flex-wrap: wrap; }
.ttl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.monthnav.sm .navbtn { width: 32px; height: 32px; }
.monthnav.sm .lbl { min-width: 128px; height: 32px; font-size: 13px; }

/* Dock de secciones */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock-in { pointer-events: auto; display: flex; gap: 4px; padding: 4px; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.dock button { height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background .12s; }
.dock button:hover { background: var(--tint2); }
.dock button[aria-current="true"], .dock button[aria-current="true"]:hover { background: var(--pink); }
@media (max-width: 420px) { .dock button { padding: 0 10px; font-size: 13px; } }
.sum { width: 100%; border-collapse: collapse; font-size: 14px; }
.sum th { font: 600 10.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 11px 10px 9px; border-bottom: 1px solid var(--hair); }
.sum th:first-child { text-align: left; padding-left: 16px; }
.sum td { padding: 9px 10px; border-bottom: 1px solid var(--hair); text-align: right; font: 400 13px var(--mono); font-variant-numeric: tabular-nums; }
.sum tr:last-child td { border-bottom: 0; }
.sum td:first-child { padding-left: 16px; font: 400 14px var(--sans); text-align: left; max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum td:last-child, .sum th:last-child { padding-right: 16px; }

.chartbox { padding: 18px 16px 12px; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; border-bottom: 1px solid var(--line); }
.bar { flex: 1 1 0; min-width: 0; background: var(--bar); border-radius: 2px 2px 0 0; }
.bar.now { outline: 1px solid var(--ink); outline-offset: 1px; }
.bar.fut { height: 2px !important; background: var(--hair); }
.lbls { display: flex; gap: 3px; margin-top: 6px; }
.lbls span { flex: 1 1 0; min-width: 0; text-align: center; font: 400 9px var(--mono); color: var(--muted); white-space: nowrap; }

/* Cuadrícula mensual */
.gridwrap { overflow-x: auto; }
table.grid { border-collapse: separate; border-spacing: 0; min-width: 100%; }
.grid th, .grid td { padding: 0; text-align: center; font-weight: 400; }
.grid .name { position: sticky; left: 0; z-index: 2; background: var(--bg); text-align: left; padding: 0 12px 0 16px; min-width: 140px; max-width: 170px; border-right: 1px solid var(--line); }
.grid thead .name { font: 600 10.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.grid tbody .name > span { display: block; max-width: 142px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.grid th.week { font: 600 10.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 10px 0 8px; }
.grid th.dow { font: 400 10px/1 var(--mono); color: var(--muted); padding: 4px 0 2px; }
.grid th.dnum { font: 400 11px/1 var(--mono); padding: 2px 0 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.grid th.dnum span { display: inline-block; min-width: 20px; padding: 3px 0; border-radius: 4px; }
.grid th.dnum.today span { background: var(--ink); color: var(--bg); }
.grid td.day { width: 28px; min-width: 28px; height: 36px; border-bottom: 1px solid var(--hair); }
.grid tbody tr:last-child td, .grid tbody tr:last-child th { border-bottom: 0; }
.grid .wk { border-left: 1px solid var(--line); }
.grid .alt { background: var(--tint); }
.grid td.today { background: var(--tint2); }
.grid td.off .chk:not([aria-pressed="true"]) { border-color: var(--hair); }
.grid td.frz .chk:not([aria-pressed="true"]) { border-color: var(--bar); background: repeating-linear-gradient(135deg, var(--bar) 0 2px, transparent 2px 4px); }

/* Mapa del año */
.heatctl { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px 0; }
.heatwrap { overflow-x: auto; padding: 16px 16px 14px; }
.heatgrid { display: grid; grid-template-rows: 14px repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; width: max-content; }
.hl { font: 400 9px/14px var(--mono); color: var(--muted); white-space: nowrap; }
.hc { display: block; width: 12px; height: 12px; border-radius: 2px; background: var(--tint2); }
.hc.void { background: transparent; }
.hc.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--hair); }
.hc.frz { background: repeating-linear-gradient(135deg, var(--bar) 0 2px, transparent 2px 4px), var(--tint2); }
.legend { display: flex; align-items: center; gap: 4px; margin-top: 12px; font: 400 11px var(--mono); color: var(--muted); }
.legend span { margin: 0 4px; }

.status { margin: 0; text-align: center; font: 400 11.5px var(--mono); color: var(--muted); min-height: 1.4em; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Mis hábitos</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="navrow">
      <button type="button" class="btn" id="export" hidden>Exportar CSV</button>
      <button type="button" class="btn" id="gotoday" hidden>Hoy</button>
      <nav class="monthnav" aria-label="Cambiar de mes">
        <button type="button" class="navbtn" id="prev" aria-label="Mes anterior">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5 4.5 7 9 11.5"/></svg>
        </button>
        <span class="lbl" id="monthlabel" aria-live="polite"></span>
        <button type="button" class="navbtn" id="next" aria-label="Mes siguiente">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5 9.5 7 5 11.5"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <div class="sec" id="sec-hoy">
    <div class="duo">
      <section class="card" aria-labelledby="t-hoy">
        <div class="card-h"><h2 id="t-hoy">Hoy</h2><span class="meta" id="todaycount"></span></div>
        <div id="today"></div>
        <form id="addform" class="add" autocomplete="off">
          <label class="sr" for="newname">Nuevo hábito</label>
          <input id="newname" maxlength="40" placeholder="Nuevo hábito, por ejemplo: leer 20 minutos">
          <button type="submit" class="btn solid">Añadir</button>
        </form>
      </section>
      <section class="card" id="progcard" aria-labelledby="t-prog" hidden>
        <div class="card-h"><h2 id="t-prog">Progreso diario</h2><span class="meta" id="avgnote"></span></div>
        <div class="chartbox" id="chart"></div>
      </section>
    </div>
  </div>

  <div class="sec stack" id="sec-mes" hidden>
    <section class="card" aria-labelledby="t-mes">
      <div class="card-h hasnav">
        <div class="ttl"><h2 id="t-mes">Registro del mes</h2><span class="meta">Toca un cuadro para marcar el día</span></div>
        <nav class="monthnav sm" aria-label="Cambiar de mes">
          <button type="button" class="navbtn" id="prev2" aria-label="Mes anterior"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5 4.5 7 9 11.5"/></svg></button>
          <span class="lbl" id="monthlabel2"></span>
          <button type="button" class="navbtn" id="next2" aria-label="Mes siguiente"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5 9.5 7 5 11.5"/></svg></button>
        </nav>
      </div>
      <div class="gridwrap" id="gridwrap"></div>
    </section>

    <section class="card" aria-labelledby="t-year">
      <div class="card-h"><h2 id="t-year">Mapa del año</h2><span class="meta" id="yearnote"></span></div>
      <div class="heatctl" id="heatctl"></div>
      <div class="heatwrap" id="heat"></div>
    </section>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
</div>

<nav class="dock" id="dock" aria-label="Secciones" hidden>
  <div class="dock-in">
    <button type="button" data-go="sec-hoy" aria-current="true">Hoy y diario</button>
    <button type="button" data-go="sec-mes">Registro y mapa del año</button>
  </div>
</nav>

<script>
(function () {
  'use strict';

  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  var SUGGEST = ['Beber agua','Leer 20 minutos','Hacer ejercicio','Meditar','Salir a caminar','Estudiar 1 hora'];
  var LS_KEY = 'habitos-v1';
  var ORDER = [1, 2, 3, 4, 5, 6, 0];
  var FULL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MILES = { d: [7, 14, 21, 30, 50, 100, 200, 365], w: [4, 8, 12, 26, 52] };

  /*PURE*/
  function ymKey(y, m0) { return y + '-' + (m0 < 9 ? '0' : '') + (m0 + 1); }
  function daysIn(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }
  function epoch(y, m0, d) { return Math.floor(Date.UTC(y, m0, d) / 864e5); }
  function isDone(h, y, m0, d) { return ((((h.done[ymKey(y, m0)] || 0) >>> (d - 1)) & 1) === 1); }
  function toggleDay(h, y, m0, d) {
    var k = ymKey(y, m0), next = (h.done[k] || 0) ^ (1 << (d - 1));
    if (next === 0) { delete h.done[k]; } else { h.done[k] = next; }
  }
  function popcount(n) { var c = 0; while (n) { c += n & 1; n >>>= 1; } return c; }
  function monthCount(h, y, m0) { return popcount(h.done[ymKey(y, m0)] || 0); }
  function fromEpoch(e) { var d = new Date(e * 864e5); return { y: d.getUTCFullYear(), m0: d.getUTCMonth(), d: d.getUTCDate() }; }
  function wday(e) { return new Date(e * 864e5).getUTCDay(); }
  function weekStart(e) { return e - ((wday(e) + 6) % 7); }
  function epochSet(map) {
    var set = {};
    Object.keys(map || {}).forEach(function (k) {
      var p = k.split('-'), y = +p[0], m0 = +p[1] - 1, mask = map[k];
      for (var d = 1; d <= 31; d++) { if ((mask >>> (d - 1)) & 1) { set[epoch(y, m0, d)] = 1; } }
    });

  }

  function isScheduled(h, e) { return h.mode !== 'days' || h.days.indexOf(wday(e)) >= 0; }
  function streaks(h, todayE) {
    var set = epochSet(h.done), fz = epochSet(h.free);
    var keys = Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
    var weekly = h.mode === 'weekly';
    var out = { current: 0, best: 0, doneToday: !!set[todayE], weekly: weekly, weekCount: 0 };
    var ws = weekStart(todayE), i, e;
    for (i = 0; i < 7; i++) { if (set[ws + i] || fz[ws + i]) { out.weekCount++; } }
    if (!keys.length) { return out; }
    if (weekly) {
      var cnt = {};
      keys.forEach(function (k) { var w = weekStart(k); cnt[w] = (cnt[w] || 0) + 1; });

      var met = function (w) { return (cnt[w] || 0) >= h.n; };
      var wks = Object.keys(cnt).map(Number).filter(met).sort(function (a, b) { return a - b; });
      var run = 0, prev = null;
      wks.forEach(function (w) { run = (prev !== null && w === prev + 7) ? run + 1 : 1; if (run > out.best) { out.best = run; } prev = w; });
      var cw = ws;
      if (!met(cw)) { cw -= 7; }
      while (met(cw)) { out.current++; cw -= 7; }
      return out;
    }

        changed(); renderAll();
      } else {
        var tgt = fromEpoch(epoch(T.y, T.m0, T.d) - (+b.getAttribute('data-off')));
        if (isDone(h, tgt.y, tgt.m0, tgt.d)) { flash('Ese día ya está marcado como hecho.'); }
        else { h.free[ymKey(tgt.y, tgt.m0)] = 1 << (tgt.d - 1); changed(); renderAll(); }
      }
    } else if (act === 'heat') {
      ui.heat = b.getAttribute('data-v');
      rerender('button[data-act="heat"][data-v="' + ui.heat + '"]');
    } else if (act === 'chip') {
      addHabit(b.getAttribute('data-name'));
      $('newname').focus();
    }
  });

  $('today').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target.closest('form'); if (!f) { return; }
    var h = findHabit(f.getAttribute('data-id')), v = f.querySelector('input').value.trim().slice(0, 40), dr = ui.draft;
    if (h && dr) {
      if (dr.mode === 'days' && !dr.days.length) { syncDraft(); flash('Elige al menos un día.'); return; }
      if (v) { h.name = v; }
      h.mode = dr.mode; h.days = dr.days.slice().sort(function (a, b) { return a - b; }); h.n = dr.n;
      changed();
    }
    ui.editing = null; ui.confirm = null; ui.draft = null; renderAll();
  });

  $('addform').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('newname');
    if (addHabit(input.value)) { input.value = ''; }
    input.focus();
  });

  $('prev').addEventListener('click', function () {
    view.m0--; if (view.m0 < 0) { view.m0 = 11; view.y--; }
    renderAll();
  });
  $('next').addEventListener('click', function () {
    if (monthDiff() >= 0) { return; }
    view.m0++; if (view.m0 > 11) { view.m0 = 0; view.y++; }
    renderAll();
  });
  $('gotoday').addEventListener('click', function () { view.y = T.y; view.m0 = T.m0; renderAll(); });
  $('prev2').addEventListener('click', function () { $('prev').click(); });
  $('next2').addEventListener('click', function () { $('next').click(); });

  /* Dock: ir a cada sección y marcar en cuál estás */
  var SECS = ['sec-hoy', 'sec-mes'], dockLock = 0, ticking = false;
  function setActive(id) {
    Array.prototype.forEach.call(document.querySelectorAll('#dock [data-go]'), function (b) {
      if (b.getAttribute('data-go') === id) { b.setAttribute('aria-current', 'true'); } else { b.removeAttribute('aria-current'); }
    });
  }
  function currentSection() {
    var de = document.documentElement, vh = window.innerHeight || de.clientHeight, cur = SECS[0], vis = [];
    SECS.forEach(function (id) {
      var el = $(id);
      if (!el.hidden) { vis.push(id); if (el.getBoundingClientRect().top <= vh * 0.35) { cur = id; } }
    });
    if (window.scrollY > 0 && window.scrollY + vh >= de.scrollHeight - 4 && vis.length) { cur = vis[vis.length - 1]; }
    return cur;
  }
  function onScroll() {
    if (Date.now() < dockLock || ticking) { return; }
    ticking = true;
    requestAnimationFrame(function () { ticking = false; setActive(currentSection()); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  $('dock').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (!b) { return; }
    var id = b.getAttribute('data-go'), el = $(id);
    var smooth = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    setActive(id); dockLock = Date.now() + 900;
    if (id === SECS[0]) { window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' }); }
    else if (el) { el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' }); }
    setTimeout(onScroll, 950);
  });

  /* Cambio de día mientras la página sigue abierta */
  function refreshToday() {
    var n = new Date();
    if (n.getDate() !== T.d || n.getMonth() !== T.m0 || n.getFullYear() !== T.y) {
      var wasCurrent = monthDiff() === 0;
      setToday(n);
      if (wasCurrent) { view.y = T.y; view.m0 = T.m0; }
      renderAll();
    }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { refreshToday(); } });
  setInterval(refreshToday, 60000);

  /* ---------- Arranque ---------- */
  loadLocal();
  renderAll();

  $('export').addEventListener('click', function () {
    if (!dl) { return; }
    dl.save({ filename: 'habitos.csv', data: buildCSV() }).then(function () { flash('Archivo guardado.'); }).catch(function (err) {
      if (!err || err.code !== 'declined') { flash('No se pudo guardar el archivo.'); }
    });
  });

  var claudeApi = window.claude;
  if (!claudeApi || typeof claudeApi.use !== 'function') { setStatus('local'); return; }
  claudeApi.use('downloads').then(function (d) { dl = d; renderHeader(); }).catch(function () { dl = null; });
  Promise.all([claudeApi.use('db'), claudeApi.use('user')]).then(function (res) {
    var db = res[0], user = res[1];
    if (!db || !user) { setStatus('local'); return; }
    return user.id().then(function (uid) {
      if (!uid) { setStatus('local'); return; }
      doc = db.doc('data/users/' + uid + '/tracker');
      var seeded = false;
      doc.onSnapshot(function (snap) {
        if (snap.metadata.hasPendingWrites) { return; }
        if (snap.exists) {
          var data = snap.data() || {};
          if (!saving && !dirty) {
            var incoming = sanitize(data.habits);
            if (JSON.stringify(incoming) !== JSON.stringify(state.habits)) {
              state.habits = incoming; saveLocal(); renderAll();
            }
            setStatus('saved');
          }
        } else if (!snap.metadata.fromCache) {
          if (!seeded && state.habits.length) { seeded = true; dirty = true; flush(); }
          else { setStatus('saved'); }
        }
      }, function () { doc = null; setStatus('local'); });
    });
  }).catch(function () { setStatus('local'); });
})();
</script>
